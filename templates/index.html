<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Prediction API</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
            font-size: 0.9em;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }

        .form-section-title {
            font-size: 1.2em;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: 600;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 30px;
            padding: 20px;
            border-radius: 6px;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.queued {
            background: #e3f2fd;
            color: #1976d2;
            border-left: 4px solid #1976d2;
        }

        .status.processing {
            background: #fff3e0;
            color: #f57c00;
            border-left: 4px solid #f57c00;
        }

        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #2e7d32;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #c62828;
        }

        .prediction-result {
            margin-top: 20px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 6px;
        }

        .prediction-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }

        .prediction-label {
            color: #666;
            font-size: 0.9em;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .api-url-input {
            margin-bottom: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 6px;
        }

        .api-url-input label {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .api-url-input input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 0.95em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏠 House Price Prediction</h1>
        <p class="subtitle">Enter house features to get a price prediction</p>

        <div class="api-url-input">
            <label for="apiUrl">API Base URL:</label>
            <input type="text" id="apiUrl" value="" placeholder="https://your-api-url.com">
        </div>

        <form id="predictionForm">
            <div class="form-section">
                <div class="form-section-title">Basic Information</div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="bedrooms">Bedrooms</label>
                        <input type="number" id="bedrooms" name="bedrooms" step="0.1" value="3" required>
                    </div>
                    <div class="form-group">
                        <label for="bathrooms">Bathrooms</label>
                        <input type="number" id="bathrooms" name="bathrooms" step="0.1" value="2.5" required>
                    </div>
                    <div class="form-group">
                        <label for="floors">Floors</label>
                        <input type="number" id="floors" name="floors" step="0.1" value="1.5" required>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <div class="form-section-title">Square Footage</div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="sqft_living">Living Area (sqft)</label>
                        <input type="number" id="sqft_living" name="sqft_living" step="0.1" value="2000" required>
                    </div>
                    <div class="form-group">
                        <label for="sqft_lot">Lot Size (sqft)</label>
                        <input type="number" id="sqft_lot" name="sqft_lot" step="0.1" value="5000" required>
                    </div>
                    <div class="form-group">
                        <label for="sqft_above">Above Ground (sqft)</label>
                        <input type="number" id="sqft_above" name="sqft_above" step="0.1" value="1500" required>
                    </div>
                    <div class="form-group">
                        <label for="sqft_basement">Basement (sqft)</label>
                        <input type="number" id="sqft_basement" name="sqft_basement" step="0.1" value="500" required>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <div class="form-section-title">Property Features</div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="waterfront">Waterfront (0 or 1)</label>
                        <input type="number" id="waterfront" name="waterfront" step="0.1" value="0" min="0" max="1" required>
                    </div>
                    <div class="form-group">
                        <label for="view">View Rating</label>
                        <input type="number" id="view" name="view" step="0.1" value="0" required>
                    </div>
                    <div class="form-group">
                        <label for="condition">Condition (1-5)</label>
                        <input type="number" id="condition" name="condition" step="0.1" value="3" min="1" max="5" required>
                    </div>
                    <div class="form-group">
                        <label for="grade">Grade</label>
                        <input type="number" id="grade" name="grade" step="0.1" value="7" required>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <div class="form-section-title">Location & Year</div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="zipcode">ZIP Code</label>
                        <input type="number" id="zipcode" name="zipcode" value="98118" required>
                    </div>
                    <div class="form-group">
                        <label for="lat">Latitude</label>
                        <input type="number" id="lat" name="lat" step="0.0001" value="47.5" required>
                    </div>
                    <div class="form-group">
                        <label for="long">Longitude</label>
                        <input type="number" id="long" name="long" step="0.0001" value="-122.3" required>
                    </div>
                    <div class="form-group">
                        <label for="yr_built">Year Built</label>
                        <input type="number" id="yr_built" name="yr_built" step="0.1" value="1980" required>
                    </div>
                    <div class="form-group">
                        <label for="yr_renovated">Year Renovated (0 if never)</label>
                        <input type="number" id="yr_renovated" name="yr_renovated" step="0.1" value="0" required>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <div class="form-section-title">Neighborhood Averages</div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="sqft_living15">Avg Living Area (15 neighbors)</label>
                        <input type="number" id="sqft_living15" name="sqft_living15" step="0.1" value="1800" required>
                    </div>
                    <div class="form-group">
                        <label for="sqft_lot15">Avg Lot Size (15 neighbors)</label>
                        <input type="number" id="sqft_lot15" name="sqft_lot15" step="0.1" value="5500" required>
                    </div>
                </div>
            </div>

            <button type="submit" id="submitBtn">Get Prediction</button>
        </form>

        <div id="status" class="status"></div>
        <div id="result" class="prediction-result" style="display: none;"></div>
    </div>

    <script>
        // Auto-detect API URL from current window location
        const currentUrl = window.location.origin;
        const apiUrlInput = document.getElementById('apiUrl');
        apiUrlInput.value = currentUrl;

        let pollingInterval = null;

        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Clear previous results
            clearPolling();
            document.getElementById('result').style.display = 'none';
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            const apiUrl = apiUrlInput.value.trim() || currentUrl;
            
            // Collect form data
            const formData = {
                bedrooms: parseFloat(document.getElementById('bedrooms').value),
                bathrooms: parseFloat(document.getElementById('bathrooms').value),
                sqft_living: parseFloat(document.getElementById('sqft_living').value),
                sqft_lot: parseFloat(document.getElementById('sqft_lot').value),
                floors: parseFloat(document.getElementById('floors').value),
                waterfront: parseFloat(document.getElementById('waterfront').value),
                view: parseFloat(document.getElementById('view').value),
                condition: parseFloat(document.getElementById('condition').value),
                grade: parseFloat(document.getElementById('grade').value),
                sqft_above: parseFloat(document.getElementById('sqft_above').value),
                sqft_basement: parseFloat(document.getElementById('sqft_basement').value),
                yr_built: parseFloat(document.getElementById('yr_built').value),
                yr_renovated: parseFloat(document.getElementById('yr_renovated').value),
                zipcode: parseInt(document.getElementById('zipcode').value),
                lat: parseFloat(document.getElementById('lat').value),
                long: parseFloat(document.getElementById('long').value),
                sqft_living15: parseFloat(document.getElementById('sqft_living15').value),
                sqft_lot15: parseFloat(document.getElementById('sqft_lot15').value)
            };

            try {
                // Submit prediction job
                const response = await fetch(`${apiUrl}/predict`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ detail: `HTTP ${response.status}` }));
                    throw new Error(errorData.detail || `HTTP error! status: ${response.status}`);
                }

                const jobData = await response.json();
                const jobId = jobData.job_id;

                showStatus('queued', `Job submitted! Job ID: ${jobId}`);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Get Prediction';

                // Start polling for results
                pollJobStatus(apiUrl, jobId);

            } catch (error) {
                showStatus('error', `Error: ${error.message}`);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Get Prediction';
            }
        });

        function pollJobStatus(apiUrl, jobId) {
            showStatus('processing', `<div class="spinner"></div>Processing prediction...`);

            pollingInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${apiUrl}/predict/job/${jobId}`);
                    
                    if (!response.ok) {
                        if (response.status === 404) {
                            throw new Error('Job not found');
                        }
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const jobStatus = await response.json();

                    if (jobStatus.status === 'finished') {
                        clearPolling();
                        showStatus('success', 'Prediction completed!');
                        displayResult(jobStatus.result);
                    } else if (jobStatus.status === 'failed') {
                        clearPolling();
                        showStatus('error', `Prediction failed: ${jobStatus.error || 'Unknown error'}`);
                    } else {
                        // Still processing
                        showStatus('processing', `<div class="spinner"></div>Status: ${jobStatus.status}...`);
                    }
                } catch (error) {
                    clearPolling();
                    showStatus('error', `Error checking job status: ${error.message}`);
                }
            }, 2000); // Poll every 2 seconds
        }

        function clearPolling() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
        }

        function showStatus(type, message) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type} show`;
            statusDiv.innerHTML = message;
        }

        function displayResult(result) {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            
            const price = result.prediction;
            const formattedPrice = new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                maximumFractionDigits: 0
            }).format(price);

            resultDiv.innerHTML = `
                <div class="prediction-label">Predicted House Price</div>
                <div class="prediction-value">${formattedPrice}</div>
                ${result.zipcode ? `<div style="margin-top: 10px; color: #666;">ZIP Code: ${result.zipcode}</div>` : ''}
                ${result.features_used ? `<div style="margin-top: 10px; color: #666; font-size: 0.85em;">Features used: ${result.features_used.length}</div>` : ''}
            `;
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            clearPolling();
        });
    </script>
</body>
</html>
